<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textron Live Monitor</title>
<style>
:root{
  --bg:#1c2334;
  --panel:rgba(13,18,32,.9);
  --card:rgba(255,255,255,.045);
  --card-hi:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.09);
  --border-hi:rgba(255,255,255,.18);
  --text:#f2f5fc;
  --muted:#9aa6c4;
  --faint:#68739a;
  --lime:#d7f463;
  --lime-soft:rgba(215,244,99,.14);
  --pink:#ff7eb6;
  --yellow:#ffd166;
  --blue:#8fb8ff;
  --mint:#7ee2c3;
  --violet:#c59bff;
  --amber:#ffbf73;
  --red:#ff8a9d;
  --mono:SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--text);font-family:var(--sans);
  background:linear-gradient(160deg,#252e48,#181f30 70%);
  -webkit-font-smoothing:antialiased;display:flex;
}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;pointer-events:none}
.rail,.main{position:relative;z-index:1}

/* ── left icon rail ── */
.rail{
  width:76px;flex:0 0 76px;height:100vh;position:sticky;top:0;
  background:linear-gradient(180deg,#8694b7,#6d7ca3);
  display:flex;flex-direction:column;align-items:center;padding:22px 0;gap:34px;
}
.rail-logo{width:44px;height:44px;display:grid;place-items:center;overflow:hidden}
.rail-logo img{display:block;width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(20,28,50,.28))}

.rail-icons{display:flex;flex-direction:column;gap:14px;flex:1}
.ricon{
  width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;color:#eef2fb;background:transparent;
  transition:background .15s,transform .15s;
}
.ricon:hover{background:rgba(255,255,255,.22)}
.ricon.active{background:#fff;color:#33405f;box-shadow:0 8px 20px rgba(20,28,50,.35)}
.ricon svg{width:20px;height:20px}
.rail-bottom{display:flex;flex-direction:column;align-items:center;gap:12px}
.avatar{
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,.12);
  display:grid;place-items:center;color:#1c2334;font-weight:800;font-size:17px;
  border:2px solid rgba(255,255,255,.65);overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:contain}
.avatar-sm .textron-logo{filter:invert(1) drop-shadow(0 3px 6px rgba(0,0,0,.25))}

/* ── main column ── */
.main{flex:1;min-width:0;padding:0 44px 64px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:34px;
}
.net-chip{display:flex;align-items:center;gap:12px}
.avatar-sm{
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;color:#1c2334;font-weight:800;font-size:15px;
  overflow:hidden;background:rgba(255,255,255,.12);
}
.avatar-sm img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.net-name{font-weight:700;font-size:15px}
.net-sub{font-size:12px;color:var(--muted);margin-top:1px}
.top-right{display:flex;align-items:center;gap:16px}
.clock{font-family:var(--mono);font-size:12px;color:var(--faint)}
.live-pill{
  height:40px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--border);
  display:inline-flex;align-items:center;gap:9px;padding:0 16px;font-size:13px;font-weight:600;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(215,244,99,.18);animation:pulse 1.6s infinite}

/* ── hero ── */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:22px}
.hero-titles{display:flex;flex-direction:column;gap:10px}
h1{margin:0;font-size:44px;line-height:1.02;font-weight:700;letter-spacing:-.02em;color:#fff;text-shadow:0 4px 30px rgba(20,30,60,.6)}
.hero-sub{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.hero-link{display:inline-flex;align-items:center;gap:6px;color:var(--lime);text-decoration:none;font-weight:600}
.hero-link:hover{text-decoration:underline}
.kpis{display:flex;gap:44px;flex-wrap:wrap}
.kpi .k{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.kpi .v{font-size:20px;font-weight:600;color:#cdd8f2;font-family:var(--mono)}
.kpi .v em{font-style:normal;color:var(--lime)}

/* ── layout ── */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;align-items:start}
.col-main{min-width:0;display:flex;flex-direction:column;gap:22px}
.col-side{position:sticky;top:20px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 40px);overflow:auto;padding-right:2px}

/* ── panels ── */
.panel,.spanel{
  background:var(--panel);border:1px solid var(--border);border-radius:18px;
  box-shadow:0 24px 60px rgba(8,12,24,.35);
}
.panel{padding:22px 24px}
/* 网络图面板：flex 容器 + gap（不再用 margin，避免与 order 重排叠加）*/
#graphs{display:flex;flex-direction:column;gap:18px}
.spanel{padding:20px 22px}
.sp-title{font-size:17px;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}
.panel-meta{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:12px}
.panel-meta b{color:var(--muted)}
/* ── 网络管理面板 ── */
#netmgr-wrap{margin:0 26px 18px;border-radius:18px}
#netmgr-wrap summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;user-select:none}
#netmgr-wrap[open] summary{margin-bottom:14px}
.nm-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px}
.nm-col{min-width:0;display:flex;flex-direction:column;gap:12px}
.nm-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.nm-title{font-size:12px;color:#d9e6ff;font-weight:700;margin-bottom:2px}
.nm-sub{font-size:11px;color:var(--faint);line-height:1.5;margin-bottom:10px}
.nm-net{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.nm-net:hover{border-color:rgba(143,184,255,.45)}
.nm-net.on{border-color:rgba(126,226,195,.7);color:#d9e6ff;background:rgba(126,226,195,.06)}
.nm-net b{color:#eaf1ff;font-weight:600}
.nm-net .nm-layers{font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap;text-align:right}
.nm-net .nm-empty{display:block;font-size:10.5px;color:#ffb86b}
.nm-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.nm-field label{font-size:11px;color:var(--muted);font-weight:600}
.nm-field label .q{cursor:help;color:var(--faint);font-weight:400}
.nm-field input{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;color:#eaf1ff;padding:6px 10px;font-size:12.5px;width:100%;box-sizing:border-box}
.nm-field input:focus{outline:none;border-color:rgba(143,184,255,.6)}
.nm-field input.nm-k{width:64px;text-align:center}
.nm-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.nm-hint{font-size:10.5px;color:var(--faint);line-height:1.6;margin:2px 0 0}
.nm-btn{background:rgba(143,184,255,.14);border:1px solid rgba(143,184,255,.4);border-radius:9px;color:#d9e6ff;padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;align-self:flex-end}
.nm-btn:hover{background:rgba(143,184,255,.24)}
.nm-btn.primary{background:rgba(126,226,195,.18);border-color:rgba(126,226,195,.55);color:#bdf0dd}
.nm-btn.primary:hover{background:rgba(126,226,195,.3)}
.nm-btn.ghost{background:transparent;border-color:var(--border);color:var(--faint)}
.nm-msg{font-size:11.5px;margin-top:6px;color:#7ee2c3;min-height:16px;white-space:pre-wrap}
.nm-msg.err{color:#ff7eb6}
.mono-line{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0 0 14px;word-break:break-all;line-height:1.7}
.mono-line em{font-style:normal;color:var(--lime)}

/* ── graph (canvas) ── */
.graph{
  position:relative;border:1px solid var(--border);border-radius:14px;overflow:auto;
  max-height:74vh;
  background:
    radial-gradient(720px 420px at 50% 38%,rgba(140,170,255,.07),transparent 70%),
    rgba(0,0,0,.30);
  padding:14px;
}
.graph canvas{display:block;cursor:crosshair}
.gtip{
  display:none;position:fixed;z-index:9999;pointer-events:auto;
  background:rgba(8,12,24,.96);border:1px solid var(--border-hi);border-radius:10px;
  padding:10px 12px;font:11px var(--mono);color:#dbe4f8;line-height:1.7;
  max-width:min(420px,86vw);white-space:pre-wrap;box-shadow:0 14px 40px rgba(0,0,0,.55);
  /* 内容过长时浮窗自身滚动，不再被 .graph(overflow:auto) 裁剪 */
  max-height:min(70vh,480px);overflow:auto;overscroll-behavior:contain;
}
.gtip b{color:var(--lime)}
.graph-foot{font:10px var(--mono);color:var(--faint);margin-top:10px}

/* ── findings table ── */
.f-head,.f-row{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center}
.f-head{font-size:12px;color:var(--faint);padding:0 2px 10px;border-bottom:1px dashed var(--border)}
.f-row{padding:11px 2px;border-bottom:1px dashed rgba(255,255,255,.05);font-size:13px}
.f-row:last-of-type{border-bottom:0}
.f-time{color:var(--muted);font-family:var(--mono);font-size:11px}
.f-net{font-family:var(--mono);font-size:12px;color:#cdd8f2}
.f-status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;min-width:74px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot-done{background:var(--lime);box-shadow:0 0 6px rgba(215,244,99,.6)}
.dot-failed{background:var(--pink);box-shadow:0 0 6px rgba(255,126,182,.6)}
.dot-running{background:var(--yellow);box-shadow:0 0 6px rgba(255,209,102,.6);animation:pulse 1.2s infinite}
.dot-other{background:var(--faint)}
.big-btn{
  width:100%;margin-top:16px;height:46px;border:0;border-radius:999px;
  background:#fff;color:#141c2e;font-size:14px;font-weight:700;cursor:pointer;
  transition:transform .12s,box-shadow .12s;
}
.big-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.4)}

/* ── events table (轨迹分页) ── */
.ev-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ev-pager{display:inline-flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted)}
.ev-btn{height:30px;min-width:30px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font:12px var(--mono);cursor:pointer;padding:0 10px;transition:background .12s}
.ev-btn:hover:not(:disabled){background:var(--card-hi)}
.ev-btn:disabled{opacity:.35;cursor:default}
.ev-filter{height:30px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font:12px var(--mono);padding:0 10px;width:190px;outline:none}
.ev-filter:focus{border-color:var(--border-hi)}
.ev-total{font:11px var(--mono);color:var(--faint)}
.ev-head,.ev-row{display:grid;grid-template-columns:96px 168px 150px 1fr 150px;gap:10px;align-items:center;padding:9px 2px}
.ev-head{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px dashed var(--border)}
.ev-row{border-bottom:1px dashed rgba(255,255,255,.05);font-size:12px}
.ev-row:last-of-type{border-bottom:0}
.ev-row:hover{background:rgba(255,255,255,.03)}
.ev-time{font-family:var(--mono);color:var(--muted);font-size:11px}
.ev-act{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:168px}
.ev-net{font:11px var(--mono);color:#cdd8f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-prev{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.ev-extra{font:11px var(--mono);color:var(--faint);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── overview ── */
.ov-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.live-badge{background:var(--lime);color:#141c2e;font-size:12px;font-weight:800;padding:4px 10px;border-radius:6px}
.ov-sub{font-size:12px;color:var(--faint);margin-bottom:8px}
.ov-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.06);font-size:13px}
.ov-row:last-child{border-bottom:0}
.ov-k{color:var(--faint)}
.ov-v{color:#e6ecf9;font-weight:600;font-family:var(--mono);font-size:12px;text-align:right;word-break:break-all}

/* ── reward bars ── */
.bars-sub{font-size:12px;color:var(--faint);margin:-6px 0 12px}
.bars-axis{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--faint);margin-top:6px}
.mc-legend{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 10px}
.mc-key{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--muted)}
.mc-key i{width:14px;height:3px;border-radius:2px;display:inline-block}
.mc-key b{color:#dbe4f8;font-weight:700}

/* ── step cards ── */
.steps{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:18px;margin-top:14px}
.step{background:rgba(22,28,46,.92);border:1px solid var(--border);border-radius:14px;padding:20px 22px;position:relative;min-height:96px}
.step .tab{position:absolute;top:-25px;left:16px;font-size:12px;font-weight:700;padding:5px 13px;border-radius:6px 6px 0 0}
.step.done .tab{background:#fff;color:#141c2e}
.step.failed .tab{background:var(--pink);color:#2a1020}
.step.active{background:var(--card-hi);border-color:var(--border-hi);box-shadow:0 22px 48px rgba(0,0,0,.45)}
.step.active .tab{background:var(--blue);color:#0e1730}
.step.pending .tab{background:rgba(255,255,255,.14);color:var(--muted)}
.step-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}
.step-title svg{width:18px;height:18px;color:var(--muted)}
.step-time{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.step-sub{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;word-break:break-all}

/* ── diag details ── */
.diag-details{padding:0;overflow:hidden}
.diag-details>summary{cursor:pointer;list-style:none;padding:16px 22px;font-weight:700;font-size:14px;border-bottom:1px solid transparent;user-select:none}
.diag-details>summary::-webkit-details-marker{display:none}
.diag-details>summary:after{content:"＋";float:right;color:var(--faint);font-weight:700}
.diag-details[open]>summary:after{content:"−"}
.diag-details[open]>summary{border-bottom-color:var(--border)}
.diag-body{padding:16px 22px}
.bw-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bw-status{font-size:12px;font-weight:700;padding:6px 13px;border-radius:999px;border:1px solid transparent}
.bw-status-done{background:var(--lime-soft);color:var(--lime);border-color:rgba(215,244,99,.3)}
.bw-status-running{background:rgba(255,209,102,.12);color:var(--yellow);border-color:rgba(255,209,102,.3)}
.bw-status-failed{background:rgba(255,126,182,.12);color:var(--pink);border-color:rgba(255,126,182,.3)}
.bw-time{font-size:12px;color:var(--faint)}
.bw-network{font-size:11px;color:var(--muted);font-family:var(--mono);padding:5px 10px;border-radius:999px;background:var(--card);border:1px solid var(--border)}
.bw-kv{display:inline-flex;align-items:center;gap:5px;margin:0 8px 6px 0;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--border)}
.bw-kv-key{color:var(--faint)}
.bw-kv-val{color:#dbe4f8;font-weight:700}
.bw-kv-val-good{color:var(--lime)}
.bw-kv-val-warn{color:var(--yellow)}
.bw-kv-val-bad{color:var(--pink)}
.bw-bar-wrap{display:inline-block;width:82px;height:7px;background:rgba(255,255,255,.08);border-radius:999px;vertical-align:middle;margin:0 4px;overflow:hidden}
.bw-bar-fill{display:block;border-radius:999px;height:100%}
.bw-bar-high{background:linear-gradient(90deg,#9dbb3a,var(--lime))}
.bw-bar-medium{background:linear-gradient(90deg,#b98a2e,var(--yellow))}
.bw-bar-low{background:linear-gradient(90deg,#b0466e,var(--pink))}

<script>
(function(){
'use strict';
var R=15,GX=230,GY=96,P=64;
var $=function(id){return document.getElementById(id)};
var heroEl=$('hero'),graphsEl=$('graphs'),stepsEl=$('steps-wrap'),diagEl=$('diag-wrap'),sideEl=$('side');
var lastS=null,histExpanded=false;

/* ═══════════════ WebGL background: domain-warped FBM glowing veins ═══════════════ */
var FRAG=[
'precision highp float;',
'uniform vec2 R;uniform float T;',
'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
' return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}',
'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<3;i++){v+=a*n(p);p=p*2.03+vec2(1.7,4.1);a*=.5;}return v;}',
'void main(){',
' vec2 uv=gl_FragCoord.xy/R;',
' vec2 p=uv;p.x*=R.x/R.y;p*=1.7;',
' float t=T*.045;',
' float q=fbm(p+t*.5);',
' float r=fbm(p+2.5*vec2(q,-q)+vec2(1.7,9.2)-t*.3);',
' float f=fbm(p+3.1*vec2(r,q));',
' float vein=pow(1.-abs(2.*f-1.),7.);',
' float vein2=pow(1.-abs(2.*q-1.),9.);',
' float mask=smoothstep(1.05,.25,distance(uv,vec2(.38,.55)));',
' vec3 col=mix(vec3(.070,.090,.150),vec3(.135,.170,.270),smoothstep(.2,.95,f));',
' col+=vein*vec3(.52,.58,.70)*(.10+.26*mask);',
' col+=vein2*vec3(.42,.52,.60)*.08*mask;',
' col+=pow(vein,3.)*vec3(.38,.44,.16)*.10*mask;',
' float d=distance(uv,vec2(.42,.45));',
' col*=1.-d*.55;',
' gl_FragColor=vec4(col,1.);',
'}'].join('\n');

var bgGL=null;
function initBG(){
  var cv=$('bg');
  try{
    var gl=cv.getContext('webgl',{antialias:false,depth:false,stencil:false,alpha:false});
    if(!gl)return;
    function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn(gl.getShaderInfoLog(s));return null}return s}
    var vs=sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
    var fs=sh(gl.FRAGMENT_SHADER,FRAG);
    if(!vs||!fs)return;
    var pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.warn(gl.getProgramInfoLog(pr));return}
    gl.useProgram(pr);
    var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    var loc=gl.getAttribLocation(pr,'a');
    gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    var uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T');
    function resize(){
      var w=Math.max(2,(innerWidth*0.35)|0),h=Math.max(2,(innerHeight*0.35)|0);
      if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}
    }
    addEventListener('resize',resize);resize();
    bgGL={draw:function(t){gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,t);gl.drawArrays(gl.TRIANGLES,0,3)}};
  }catch(e){console.warn('webgl bg disabled',e)}
}

/* ═══════════════ canvas glow sprites ═══════════════ */
function makeGlow(rgba){
  var c=document.createElement('canvas');c.width=c.height=128;
  var g=c.getContext('2d');
  var gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,rgba[0]);gr.addColorStop(0.35,rgba[1]);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  return c;
}
var glowWhite=makeGlow(['rgba(215,228,255,.55)','rgba(160,190,255,.18)']);
var glowLime=makeGlow(['rgba(215,244,99,.65)','rgba(190,230,80,.20)']);
var glowBlue=makeGlow(['rgba(143,184,255,.5)','rgba(110,150,255,.16)']);
var glowPink=makeGlow(['rgba(255,126,182,.5)','rgba(255,110,160,.16)']);
var glowMagenta=makeGlow(['rgba(255,140,230,.75)','rgba(200,70,180,.22)']);
var backwardLinger=0; // seconds since last backward event, for fade-out trail

/* ═══════════════ helpers ═══════════════ */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function short(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function hash32(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rand01(seed){var x=(seed|0)||1;x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}
function qbezPt(e,t){var u=1-t;return {x:u*u*e.x1+2*u*t*e.cx+t*t*e.x2,y:u*u*e.y1+2*u*t*e.cy+t*t*e.y2}}
function bezCtrl(x1,y1,x2,y2,bend){
  var mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
  return {x:mx+(-dy/len)*bend,y:my+(dx/len)*bend};
}
function x(layer){return P+layer*GX+GX/2}
function y(nodeId){var i=parseInt(String(nodeId).split('_')[1]||'0',10);return P+i*GY+GY/2}
function qid(layer,id){return 'L'+layer+'::'+id}
function edgeId(layer,from,to){return 'L'+layer+'::'+from+'->L'+(layer+1)+'::'+to}
function relTime(iso){
  if(!iso)return'';
  var t=Date.parse(iso);if(isNaN(t))return iso.slice(11,19);
  var diff=(Date.now()-t)/1000;
  if(diff<10)return'刚刚';
  if(diff<60)return Math.floor(diff)+'秒前';
  if(diff<3600)return Math.floor(diff/60)+'分钟前';
  if(diff<86400)return Math.floor(diff/3600)+'小时前';
  if(diff<172800)return'昨天 '+new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  return new Date(t).toLocaleDateString('zh-CN',{month:'short',day:'numeric'})+' '+new Date(t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
// 2026-08-19 修复: 原 slice(5,19) 直接切 ISO 字符串 → 显示 UTC 时间且丢年份.
// 改为 new Date() 转本地时区(CST), 显示 完整 年-月-日 时:分:秒.
function fmtClock(iso){
  var d=new Date(String(iso||''));
  if(isNaN(d.getTime())){var s=String(iso||'');return s.length>=19?s.slice(5,19).replace('T',' '):s}
  function p(n){return (n<10?'0':'')+n}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
function setHTML(el,h){if(el.__last!==h){el.__last=h;el.innerHTML=h}}
function qualityBar(q){
  if(q==null)return'';
  var w=Math.round(q*100);var cls=q>=0.7?'bw-bar-high':q>=0.35?'bw-bar-medium':'bw-bar-low';
  return '<span class="bw-bar-wrap"><span class="bw-bar-fill '+cls+'" style="width:'+w+'%"></span></span>';
}
function kv(label,val,valCls){return '<span class="bw-kv"><span class="bw-kv-key">'+esc(label)+'</span><span class="bw-kv-val'+(valCls?' '+valCls:'')+'">'+esc(String(val))+'</span></span>'}
function diagOpenKey(key){return 'textron.monitor.diag.'+key}
function isDiagOpen(key){
  var el=document.querySelector('details.diag-details[data-diag="'+key+'"]');
  if(el)return !!el.open;
  try{return localStorage.getItem(diagOpenKey(key))==='1'}catch(e){return false}
}
function diagAttrs(key){return ' data-diag="'+key+'" '+(isDiagOpen(key)?'open':'')}
function bindDiagState(){
  var els=document.querySelectorAll('details.diag-details[data-diag]');
  for(var i=0;i<els.length;i++){
    if(els[i].__diagBound)continue;
    els[i].__diagBound=true;
    els[i].addEventListener('toggle',function(){
      try{localStorage.setItem(diagOpenKey(this.getAttribute('data-diag')),this.open?'1':'0')}catch(e){}
    });
  }
}

/* ═══════════════ graph views (persistent canvases) ═══════════════ */
var graphViews={};
var DPR=Math.min(2,window.devicePixelRatio||1);

function ensureGraphView(name,isFirst){
  var gv=graphViews[name];
  if(gv)return gv;
  var panel=document.createElement('div');panel.className='panel';
  if(isFirst)panel.id='sec-graph';
  panel.innerHTML='<div class="panel-meta"></div><div class="mono-line"></div>'+
    '<div class="graph"><canvas></canvas><div class="gtip"></div></div><div class="graph-foot"></div>';
  graphsEl.appendChild(panel);
  var canvas=panel.querySelector('canvas'),tip=panel.querySelector('.gtip'),graph=panel.querySelector('.graph');
  gv=graphViews[name]={
    panel:panel,canvas:canvas,tip:tip,graph:graph,
    ctx:canvas.getContext('2d'),
    meta:panel.querySelector('.panel-meta'),
    path:panel.querySelector('.mono-line'),
    foot:panel.querySelector('.graph-foot'),
    data:null,W:0,H:0,R:15,dpr:1,_sig:'',staticCanvas:null,staticCtx:null
  };
  canvas.addEventListener('mousemove',function(e){onGraphHover(gv,e)});
  // 延迟隐藏：给鼠标留出从 canvas 移到浮窗上滚动的时间（浮窗自身可滚动）
  canvas.addEventListener('mouseleave',function(){ gv._hideT=setTimeout(function(){gv.tip.style.display='none'},300) });
  tip.addEventListener('mouseenter',function(){ if(gv._hideT){clearTimeout(gv._hideT);gv._hideT=null} });
  tip.addEventListener('mouseleave',function(){ gv.tip.style.display='none' });
  // ── canvas 缩放：Ctrl/⌘ + 滚轮（以光标为锚点，缩放前后光标下的内容位置不变）；双击重置 ──
  graph.addEventListener('wheel',function(e){
    if(!(e.ctrlKey||e.metaKey))return;            // 普通滚轮保留为滚动
    e.preventDefault();
    var z0=gv.zoom||1, z1=Math.min(3,Math.max(0.5,z0*(e.deltaY<0?1.12:1/1.12)));
    if(z1===z0)return;
    var rect=graph.getBoundingClientRect();
    var mx=e.clientX-rect.left, my=e.clientY-rect.top;      // 光标在视口内的偏移
    var px=(graph.scrollLeft+mx)/z0, py=(graph.scrollTop+my)/z0;  // 光标下的逻辑坐标
    gv.zoom=z1;
    applyZoom(gv);
    graph.scrollLeft=px*z1-mx;graph.scrollTop=py*z1-my;     // 锚定光标
  },{passive:false});
  graph.addEventListener('dblclick',function(){ if((gv.zoom||1)!==1){gv.zoom=1;applyZoom(gv)} });
  return gv;
}
function onGraphHover(gv,e){
  var d=gv.data;if(!d)return;
  var rect=gv.canvas.getBoundingClientRect();
  var lx=(e.clientX-rect.left)*(gv.W/rect.width),ly=(e.clientY-rect.top)*(gv.H/rect.height);
  var best=null,bd=1e9;
  for(var i=0;i<d.nodes.length;i++){
    var nd=d.nodes[i],dx=nd.cx-lx,dy=nd.cy-ly,ds=dx*dx+dy*dy;
    if(ds<bd){bd=ds;best=nd}
  }
  if(best&&bd<(gv.R+10)*(gv.R+10)){
    gv.tip.innerHTML='<b>'+esc(best.qid)+'</b>'+(best.score!=null?'  score '+Number(best.score).toFixed(3):'')+
      '\nname: '+esc(best.name||'(empty)')+'\ncontext: '+esc(best.context||'(empty)');
    if(gv._hideT){clearTimeout(gv._hideT);gv._hideT=null}
    gv.tip.style.display='block';                 // 先显示才能量到尺寸
    // 视口坐标 + 边界翻转（position:fixed 不再受 .graph 滚动/裁剪影响）
    var tw=gv.tip.offsetWidth, th=gv.tip.offsetHeight;
    var vw=window.innerWidth, vh=window.innerHeight;
    var tx=e.clientX+16, ty=e.clientY+14;
    if(tx+tw>vw-8) tx=Math.max(8, e.clientX-tw-16);   // 右越界 → 翻到光标左侧
    if(ty+th>vh-8) ty=Math.max(8, vh-th-12);          // 下越界 → 上移贴底
    gv.tip.style.left=tx+'px';
    gv.tip.style.top=ty+'px';
  }else gv.tip.style.display='none';
}

function updateGraphView(name,net,state){
  var gv=ensureGraphView(name,graphsEl.children.length===0);
  var selectedIds=state?(state.currentActivatedIds||[]):[];
  var selectedEdges=state?(state.currentSelectedEdgeIds||[]):[];
  var scores=state?(state.currentActivationScores||{}):{};
  var mutations=state?(state.currentNodeMutations||[]):[];
  var backward=state&&state.lastBackwardState?state.lastBackwardState:null;
  var backwardEdges=!!(backward&&(backward.status==='running'||Number(backward.edgesUpdated||0)>0));
  var selected={},selectedE={},mutationMap={};
  for(var i=0;i<selectedIds.length;i++)selected[selectedIds[i]]=1;
  for(var i=0;i<selectedEdges.length;i++)selectedE[selectedEdges[i]]=1;
  for(var i=0;i<mutations.length;i++)if(mutations[i]&&mutations[i].id)mutationMap[mutations[i].id]=mutations[i];

  var byL={};
  for(var i=0;i<net.nodes.length;i++){var nd=net.nodes[i];if(!byL[nd.layer])byL[nd.layer]=[];byL[nd.layer].push(nd)}
  var layers=net.layers,nL=layers.length,layerCounts=[];
  for(var l=0;l<nL;l++)layerCounts[l]=(byL[l]||[]).length;
  // Shared vertical rhythm: capacity is metadata; visible nodes determine the canvas height.
  // Every layer maps into the same track range so sparse and dense columns stay aligned.
  var maxN=Math.max.apply(null,layerCounts.concat([1]));

  var GYa=Math.max(52,Math.min(GY,Math.floor(2600/Math.max(1,maxN))));
  var Rv=maxN>30?12:(maxN>18?13:15);
  var W=nL*GX+P*2,H=maxN*GYa+P*2;
  var railInset=maxN>6?Math.min(4,Math.floor(maxN*.08)):0;

  function sharedSlots(count){
    if(!count)return[];
    if(count===1)return[Math.floor((maxN-1)/2)];
    var slots=[],span=maxN-1-railInset*2;
    for(var si=0;si<count;si++){
      var slot=Math.round(railInset+si*span/(count-1));
      // Rounding can collide when a nearly-full layer is mapped to the shared grid.
      if(si>0)slot=Math.max(slot,slots[si-1]+1);
      slot=Math.min(slot,maxN-count+si);
      slots.push(slot);
    }
    return slots;
  }

  var layerSlots={};
  for(var l=0;l<nL;l++)layerSlots[l]=sharedSlots(layerCounts[l]);

  var weights=net.weights||{},edgeWeights={},latRaw=[];
  for(var k in weights){
    var m=k.match(/^(\d+)_to_(\d+)$/);if(!m)continue;
    var l=parseInt(m[1],10),mm=parseInt(m[2],10);
    if(l===mm){ // lateral 同层扩散边(三层架构物化): 单独收集, 防与跨层桶 key 碰撞而静默丢边
      for(var j2=0;j2<weights[k].length;j2++){var le0=weights[k][j2];latRaw.push({l:l,from:le0.from,to:le0.to,w:le0.weight})}
      continue;
    }
    edgeWeights[l]=edgeWeights[l]||{};
    for(var j=0;j<weights[k].length;j++){var e=weights[k][j];edgeWeights[l][e.from+'_'+e.to]=e.weight}
  }

  var nodes=[],edges=[],selEdges=[],amb=[],goldReal=0,pos={},moved=[];
  for(var l=0;l<nL;l++){
    var list=byL[l]||[];
    for(var i=0;i<list.length;i++){
      var nd=list[i],id=qid(l,nd.id);
      var seed=hash32(name+'|'+id);
      var mut=mutationMap[id];
      var slots=layerSlots[l],slot=slots[i];
      var jitterY=Math.min(8,GYa*.12);
      var nd2={qid:id,id:nd.id,layer:l,
        // Keep columns crisp; the small deterministic drift is enough to avoid a sterile grid.
        cx:x(l)+(rand01(seed^0x9e37)-0.5)*24,
        cy:P+(slot+0.5)*GYa+(rand01(seed^0x51f7)-0.5)*jitterY*2,
        name:nd.name||'',context:nd.context||nd.content||'',
        filled:!!(nd.name||nd.content),sel:!!selected[id],
        score:scores[id],phase:rand01(seed)*6.283,drift:0.6+rand01(seed^0x77aa)*0.9,
        mutation:mut||null};
      if(mut)moved.push(nd2);
      nodes.push(nd2);pos[l+'|'+nd.id]=nd2;
    }
  }
  for(var l=0;l<nL-1;l++){
    var froms=byL[l]||[],tos=byL[l+1]||[];
    for(var fi=0;fi<froms.length;fi++){
      var fn=froms[fi],p1=pos[l+'|'+fn.id];
      for(var ti=0;ti<tos.length;ti++){
        var tn=tos[ti],wt=edgeWeights[l]&&edgeWeights[l][fn.id+'_'+tn.id];
        if(wt===undefined)continue;
        var p2=pos[(l+1)+'|'+tn.id];
        var c=bezCtrl(p1.cx,p1.cy,p2.cx,p2.cy,(rand01(hash32(name+'|e|'+l+'|'+fn.id+'|'+tn.id))-0.5)*110);
        var e={x1:p1.cx,y1:p1.cy,x2:p2.cx,y2:p2.cy,cx:c.x,cy:c.y,w:wt,
          gold:!!selectedE[edgeId(l,fn.id,tn.id)],ph:rand01(hash32(fn.id+tn.id+l))};
        if(e.gold){goldReal++;selEdges.push(e)}else{edges.push(e);if(Math.abs(wt)>=0.45)amb.push(e)}
      }
    }
  }
  amb.sort(function(a,b){return Math.abs(b.w)-Math.abs(a.w)});
  amb=amb.slice(0,14);

  // lateral 同层边: 与跳层主边同柌单线描绘(带 lat 标记→虚线细一号), 不画就等于数据丢可视化
  for(var li=0;li<latRaw.length;li++){
    var lr=latRaw[li];
    if(lr.from===lr.to)continue;
    var lp1=pos[lr.l+'|'+lr.from],lp2=pos[lr.l+'|'+lr.to];
    if(!lp1||!lp2)continue;
    var lc=bezCtrl(lp1.cx,lp1.cy,lp2.cx,lp2.cy,(rand01(hash32(name+'|lat|'+lr.from+'|'+lr.to))-0.5)*110);
    edges.push({x1:lp1.cx,y1:lp1.cy,x2:lp2.cx,y2:lp2.cy,cx:lc.x,cy:lc.y,w:lr.w,ph:rand01(hash32(lr.from+lr.to+lr.l)),lat:1});
  }

  // phantom dashed route for selected adjacent nodes without a real edge
  var phantom=[];
  for(var l=0;l<nL-1;l++){
    var a=null,b=null;
    for(var si=0;si<selectedIds.length;si++){
      if(selectedIds[si].indexOf('L'+l+'::')===0)a=selectedIds[si].split('::')[1];
      if(selectedIds[si].indexOf('L'+(l+1)+'::')===0)b=selectedIds[si].split('::')[1];
    }
    if(a&&b&&!selectedE[edgeId(l,a,b)]){
      var p1=pos[l+'|'+a],p2=pos[(l+1)+'|'+b];
      if(p1&&p2){var c=bezCtrl(p1.cx,p1.cy,p2.cx,p2.cy,36);
        phantom.push({x1:p1.cx,y1:p1.cy,x2:p2.cx,y2:p2.cy,cx:c.x,cy:c.y})}
    }
  }

  gv.data={nodes:nodes,edges:edges,selEdges:selEdges,amb:amb,phantom:phantom,mutations:moved,backwardEdges:backwardEdges};
  gv.layerCounts=layerCounts;
  gv.R=Rv;
  var dpr=(W*H>1500000)?1:Math.min(2,window.devicePixelRatio||1);
  var zoom=(gv.zoom||1);
  var fz=pxFactor(W,H,dpr,zoom);        // 分辨率因子（已封顶，防 zoom² 像素爆炸）
  if(gv.W!==W||gv.H!==H||gv.dpr!==dpr||gv._z!==zoom||gv._fz!==fz){
    gv.W=W;gv.H=H;gv.dpr=dpr;gv._z=zoom;gv._fz=fz;
    gv.canvas.width=Math.round(W*fz);gv.canvas.height=Math.round(H*fz);
    gv.canvas.style.width=(W*zoom)+'px';gv.canvas.style.height=(H*zoom)+'px';
    gv.ctx.setTransform(fz,0,0,fz,0,0);
    gv._sig='';                       // 尺寸/缩放变了 ⇒ 静态层需重建
  }
  var wsum=0;for(var wi=0;wi<edges.length;wi++)wsum+=Math.round(edges[wi].w*10000);
  var sig=layers.join(',')+'|'+nodes.length+'|'+edges.length+'|'+selectedIds.join(',')+'|'+wsum;
  if(sig!==gv._sig){gv._sig=sig;renderStatic(gv)}
  gv.meta.innerHTML='Network Graph · <b>'+esc(name)+'</b> · layers ['+layers.join(',')+'] · selected '+selectedIds.length+' · threshold '+net.threshold+' · zoom <b>'+Math.round((gv.zoom||1)*100)+'%</b>';
  gv.path.textContent=selectedIds.length?selectedIds.join(' → '):'no selected path';
  var backInfo=backwardEdges?'↩ '+(backward.edgesUpdated||0)+' edges':'';
  var ledN=(net.weights&&net.weights.ledger)?Object.keys(net.weights.ledger).length:0;
  gv.foot.textContent='selectedEdges: '+selectedEdges.length+' · glowing: '+goldReal+' · mutations: '+moved.length+' · lateral: '+latRaw.length+' · ledger trained: '+ledN+(backInfo?' · '+backInfo:'');
}

/* 缩放：Ctrl/⌘ + 滚轮（普通滚轮仍为滚动）；双击重置。内部像素随 zoom 同步放大 ⇒ 清晰 */
/* 缩放像素上限：canvas 宽高同乘 zoom ⇒ 面积按 zoom² 增长（3× 即 9 倍像素），会卡顿。
   故对「分辨率因子 fz」封顶：总像素 ≤ ZOOM_MAXPX（约 1920×1350），超出则降分辨率（略糊换流畅）。*/
var ZOOM_MAXPX=2600000;
function pxFactor(W,H,dpr,zoom){
  var fz=(dpr||1)*(zoom||1);
  var cap=Math.sqrt(ZOOM_MAXPX/Math.max(1,W*H));
  return Math.max(0.75, Math.min(fz,cap));
}
function applyZoom(gv){
  if(!gv||!gv.canvas||!gv.W)return;
  var z=gv.zoom||1, fz=pxFactor(gv.W,gv.H,gv.dpr||1,z);
  gv.canvas.width=Math.round(gv.W*fz);gv.canvas.height=Math.round(gv.H*fz);
  gv.canvas.style.width=(gv.W*z)+'px';gv.canvas.style.height=(gv.H*z)+'px';
  gv.ctx.setTransform(fz,0,0,fz,0,0);
  gv._z=z;gv._fz=fz;
  drawGraph(gv,performance.now());       // 先用旧静态层快速 blit：拖拽/滚轮期间不卡
  if(gv._rbT)clearTimeout(gv._rbT);      // 计时器挂在 gv 上：多面板各自独立，互不取消
  gv._rbT=setTimeout(function(){         // 停手 180ms 后才重建高清静态层（避免连续全量重绘）
    gv._rbT=null; gv._sig=''; renderStatic(gv); drawGraph(gv,performance.now());
  },180);
  updateZoomLabel(gv);
}
function updateZoomLabel(gv){
  if(!gv||!gv.meta)return;
  var z=Math.round((gv.zoom||1)*100);
  var tag=' · zoom <b>'+z+'%</b>';
  var cur=gv.meta.innerHTML.replace(/ · zoom <b>\d+%<\/b>/,'');
  gv.meta.innerHTML=cur+tag;
}

/* static synapse layer — rebuilt per poll, blitted per frame (perf) */
function renderStatic(gv){
  var d=gv.data;if(!d)return;
  var sc=gv.staticCanvas;
  if(!sc){sc=gv.staticCanvas=document.createElement('canvas');gv.staticCtx=sc.getContext('2d')}
  var fz=gv._fz||pxFactor(gv.W,gv.H,gv.dpr||1,gv.zoom||1);   // 与主 canvas 用同一（已封顶的）因子
  if(sc.width!==Math.round(gv.W*fz)||sc.height!==Math.round(gv.H*fz)){sc.width=Math.round(gv.W*fz);sc.height=Math.round(gv.H*fz)}
  var g=gv.staticCtx;
  g.setTransform(fz,0,0,fz,0,0);
  g.clearRect(0,0,gv.W,gv.H);
  g.lineCap='round';g.textAlign='center';
  // Quiet lane scaffolding makes empty layers and uneven counts legible without competing with edges.
  for(var li=0;li<gv.layerCounts.length;li++){
    var lx=x(li),count=gv.layerCounts[li];
    g.fillStyle=li%2?'rgba(143,184,255,.018)':'rgba(255,255,255,.012)';
    g.fillRect(lx-GX*.34,50,GX*.68,gv.H-76);
    g.fillStyle='rgba(215,228,255,.16)';g.fillRect(lx-0.5,56,1,gv.H-88);
    g.font='700 11px Inter,sans-serif';g.fillStyle='#b9c7e6';g.fillText('L'+li,lx,24);
    g.font='10px Menlo,monospace';g.fillStyle=count?'#687da8':'#4f5b78';
    g.fillText(count+' node'+(count===1?'':'s'),lx,40);
  }
  for(var i=0;i<d.edges.length;i++){
    var e=d.edges[i],aw=Math.abs(e.w);
    /* 可读性底线(2026-09-03): 每条边=一条单线(不拆发丝); 弱边保留但不抢注。旧公式
       alpha=0.06+aw*0.34 在 aw≤0.1 时仅 0.094/0.8px —— 黑底下几乎不可见，“看不清连线”就是这么来的;
       现在拉大对比度并按跳层/同层分档, 权重标签阈值 0.35→0.20。 */
    if(aw<0.02)continue;                                  // dead synapse: 不画噪声
    var alpha=(e.lat?0.10:0.14)+aw*(e.lat?0.28:0.50);
    g.strokeStyle=e.w>=0?'rgba(159,180,221,'+alpha.toFixed(3)+')':'rgba(255,150,190,'+alpha.toFixed(3)+')';
    g.lineWidth=(e.lat?0.6:0.9)+aw*(e.lat?1.6:2.8);
    if(e.lat){g.setLineDash([5,4])}else{g.setLineDash([])}   // 虚线=同层扩散, 实线=跳层主边
    g.beginPath();g.moveTo(e.x1,e.y1);g.quadraticCurveTo(e.cx,e.cy,e.x2,e.y2);g.stroke();
    g.setLineDash([]);
    if(aw>=0.20){
      var mp=qbezPt(e,0.5);
      g.fillStyle=e.w>=0?'rgba(150,166,206,.85)':'rgba(255,170,200,.8)';g.font='8px Menlo,monospace';
      g.fillText(e.w.toFixed(2),mp.x,mp.y-4);
    }
  }
}

function drawGraph(gv,t){
  var d=gv.data;if(!d||!gv.staticCanvas)return;
  var rect=gv.panel.getBoundingClientRect();
  if(rect.bottom<-60||rect.top>innerHeight+60)return; // viewport culling
  var ctx=gv.ctx,Rv=gv.R,i,e,nd;
  // 1:1 像素直拷（静态层与 canvas 同分辨率）⇒ 消除每帧全幅重采样的开销
  var fz=gv._fz||1;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,gv.canvas.width,gv.canvas.height);
  ctx.drawImage(gv.staticCanvas,0,0);
  ctx.setTransform(fz,0,0,fz,0,0);       // 恢复逻辑坐标供下方动态层使用

  // ── additive living layer ──
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  var breathe=0.7+0.3*Math.sin(t*2.1);

  // selected organic path — layered strokes instead of shadowBlur (GPU-cheap glow)
  ctx.lineCap='round';
  for(i=0;i<d.selEdges.length;i++){
    e=d.selEdges[i];
    ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.quadraticCurveTo(e.cx,e.cy,e.x2,e.y2);
    ctx.strokeStyle='rgba(215,244,99,'+(0.10*breathe).toFixed(3)+')';ctx.lineWidth=11;ctx.stroke();
    ctx.strokeStyle='rgba(215,244,99,'+(0.22*breathe).toFixed(3)+')';ctx.lineWidth=6.5;ctx.stroke();
    ctx.strokeStyle='rgba(230,250,140,'+(0.85*breathe).toFixed(3)+')';ctx.lineWidth=3.5;ctx.stroke();
  }

  // phantom dashed route
  if(d.phantom.length){
    ctx.setLineDash([7,5]);ctx.lineDashOffset=-t*22;
    ctx.strokeStyle='rgba(215,244,99,.65)';ctx.lineWidth=3;
    for(i=0;i<d.phantom.length;i++){
      e=d.phantom[i];
      ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.quadraticCurveTo(e.cx,e.cy,e.x2,e.y2);ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // backward propagation — reverse-direction wave (L2→L1→L0), distinct pink/magenta glow
  if(d.selEdges.length&&(d.backwardEdges||backwardLinger>0)){
    if(d.backwardEdges)backwardLinger=2.2;else backwardLinger=Math.max(0,backwardLinger-1/60);
    var bFade=Math.min(1,backwardLinger/0.8);
    // reverse layer order: build index
    var revEdges=[];
    for(i=0;i<d.selEdges.length;i++){e=d.selEdges[i];var lm=parseInt(e.x1,10)||0;revEdges.push({e:i,ly:lm})}
    revEdges.sort(function(a,b){return b.ly-a.ly});
    ctx.lineCap='round';
    ctx.setLineDash([7,9]);ctx.lineDashOffset=-t*30;
    for(var ri=0;ri<revEdges.length;ri++){
      e=d.selEdges[revEdges[ri].e];
      // reverse wave direction: start at L2 end, travel toward L0
      var rt=((t*0.42+ri*0.19)%1),rp=qbezPt(e,rt);
      // thick glowing band
      ctx.strokeStyle='rgba(255,100,200,'+(0.12*bFade*breathe).toFixed(3)+')';ctx.lineWidth=12;
      ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.quadraticCurveTo(e.cx,e.cy,e.x2,e.y2);ctx.stroke();
      ctx.strokeStyle='rgba(255,140,230,'+(0.50*bFade*breathe).toFixed(3)+')';ctx.lineWidth=5;
      ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.quadraticCurveTo(e.cx,e.cy,e.x2,e.y2);ctx.stroke();
      ctx.strokeStyle='rgba(255,180,245,'+(0.80*bFade*breathe).toFixed(3)+')';ctx.lineWidth=2.6;
      ctx.beginPath();ctx.moveTo(e.x1,e.y1);ctx.quadraticCurveTo(e.cx,e.cy,e.x2,e.y2);ctx.stroke();
      // lead particle (bright)
      ctx.drawImage(glowMagenta,rp.x-18,rp.y-18,36,36);
      ctx.fillStyle='rgba(255,240,255,.95)';ctx.beginPath();ctx.arc(rp.x,rp.y,3,0,6.283);ctx.fill();
      // trailing comet particles
      for(var tr=1;tr<=3;tr++){
        var trt=((rt-tr*0.06+1)%1),trp=qbezPt(e,trt);
        ctx.globalAlpha=0.3*bFade/tr;
        ctx.drawImage(glowMagenta,trp.x-12,trp.y-12,24,24);
      }
      ctx.globalAlpha=1;
    }
    ctx.setLineDash([]);
  }

  if(d.mutations&&d.mutations.length){
    ctx.lineCap='round';
    ctx.setLineDash([5,4]);
    for(i=0;i<d.mutations.length;i++){
      nd=d.mutations[i];
      var mt=nd.mutation&&nd.mutation.type||'update';
      var mutColor='rgba(143,184,255,.82)',mutGlow='rgba(143,184,255,.18)',bend=-32;
      if(mt==='add'){mutColor='rgba(126,226,195,.82)';mutGlow='rgba(126,226,195,.18)';bend=34;}
      else if(mt==='merge'){mutColor='rgba(197,155,255,.84)';mutGlow='rgba(197,155,255,.18)';bend=0;}
      else if(mt==='delete'){mutColor='rgba(255,138,157,.82)';mutGlow='rgba(255,138,157,.18)';bend=56;}
      var x2=Math.max(24,nd.cx-68-nd.layer*4),y2=nd.cy-10,cp=bezCtrl(nd.cx,nd.cy,x2,y2,bend);
      ctx.strokeStyle=mutGlow;ctx.lineWidth=9;
      ctx.beginPath();ctx.moveTo(nd.cx,nd.cy);ctx.quadraticCurveTo(cp.x,cp.y,x2,y2);ctx.stroke();
      ctx.strokeStyle=mutColor;ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(nd.cx,nd.cy);ctx.quadraticCurveTo(cp.x,cp.y,x2,y2);ctx.stroke();
      var tt=(t*0.42+i*0.13)%1,pp=qbezPt({x1:nd.cx,y1:nd.cy,cx:cp.x,cy:cp.y,x2:x2,y2:y2},tt);
      ctx.drawImage(mt==='add'?glowLime:mt==='merge'?glowBlue:mt==='delete'?glowPink:glowWhite,pp.x-12,pp.y-12,24,24);
    }
    ctx.setLineDash([]);
  }

  // pulses along selected path — signal propagation wavefront
  for(i=0;i<d.selEdges.length;i++){
    e=d.selEdges[i];
    for(var k=0;k<2;k++){
      var tt=(t*0.34+i*0.11+k*0.5)%1,p=qbezPt(e,tt);
      ctx.drawImage(glowLime,p.x-15,p.y-15,30,30);
      ctx.fillStyle='rgba(255,255,240,.95)';
      ctx.beginPath();ctx.arc(p.x,p.y,2.1,0,6.283);ctx.fill();
    }
  }

  // sparse ambient pulses on strong synapses
  for(i=0;i<d.amb.length;i++){
    e=d.amb[i];
    var tt=(t*0.06+e.ph)%1,p=qbezPt(e,tt);
    ctx.globalAlpha=0.55;
    ctx.drawImage(e.w>=0?glowBlue:glowPink,p.x-9,p.y-9,18,18);
    ctx.globalAlpha=1;
  }

  // node glows (drifting positions cached on node)
  for(i=0;i<d.nodes.length;i++){
    nd=d.nodes[i];
    var px=nd.cx+Math.cos(t*0.45*nd.drift+nd.phase*1.3)*2.2;
    var py=nd.cy+Math.sin(t*0.6*nd.drift+nd.phase)*3;
    nd._px=px;nd._py=py;
    if(nd.sel){
      var wave=0.55+0.45*Math.sin(t*2.6-nd.layer*0.9);
      var s=52+22*wave;
      ctx.drawImage(glowLime,px-s/2,py-s/2,s,s);
    }else if(nd.mutation){
      var mt=nd.mutation.type;
      var glow=mt==='add'?glowLime:mt==='merge'?glowBlue:mt==='delete'?glowPink:glowWhite;
      ctx.globalAlpha=mt==='add'?0.95:mt==='merge'?0.88:mt==='delete'?0.82:0.72;
      ctx.drawImage(glow,px-24,py-24,48,48);
      ctx.globalAlpha=1;
    }else if(nd.filled){
      ctx.globalAlpha=nd.score!=null?Math.min(1,0.3+nd.score*0.8):0.45;
      ctx.drawImage(glowWhite,px-22,py-22,44,44);
      ctx.globalAlpha=1;
    }
  }
  ctx.restore();

  // ── cell bodies (membrane wobble on selected) ──
  for(i=0;i<d.nodes.length;i++){
    nd=d.nodes[i];
    var px=nd._px!=null?nd._px:nd.cx,py=nd._py!=null?nd._py:nd.cy;
    if(nd.sel){
      ctx.beginPath();
      for(var a=0;a<9;a++){
        var ang=a/9*6.283,rr=Rv+2+Math.sin(t*3.2+nd.phase+a*2.4)*1.6;
        var vx=px+Math.cos(ang)*rr,vy=py+Math.sin(ang)*rr;
        if(a)ctx.lineTo(vx,vy);else ctx.moveTo(vx,vy);
      }
      ctx.closePath();
      ctx.fillStyle='#d7f463';ctx.fill();
      ctx.strokeStyle='#eaffb0';ctx.lineWidth=2.5;ctx.stroke();
    }else if(nd.mutation){
      var mt=nd.mutation.type;
      ctx.beginPath();ctx.arc(px,py,Rv+1,0,6.283);
      ctx.fillStyle=mt==='add'?'rgba(126,226,195,.94)':mt==='merge'?'rgba(197,155,255,.92)':mt==='delete'?'rgba(255,138,157,.92)':'rgba(143,184,255,.92)';
      ctx.fill();
      ctx.strokeStyle=mt==='add'?'rgba(183,255,229,.72)':mt==='merge'?'rgba(227,200,255,.72)':mt==='delete'?'rgba(255,185,196,.72)':'rgba(205,220,250,.72)';
      ctx.lineWidth=1.7;ctx.stroke();
    }else{
      ctx.beginPath();ctx.arc(px,py,Rv,0,6.283);
      if(nd.filled){ctx.fillStyle='rgba(205,220,250,.92)';ctx.fill();ctx.strokeStyle='rgba(235,242,255,.5)';ctx.lineWidth=1.4;ctx.stroke()}
      else{ctx.fillStyle='rgba(74,88,128,.5)';ctx.fill();ctx.strokeStyle='rgba(120,135,175,.4)';ctx.lineWidth=1.2;ctx.stroke()}
    }
  }

  // ── labels ──
  ctx.textAlign='center';
  for(i=0;i<d.nodes.length;i++){
    nd=d.nodes[i];
    var px=nd._px!=null?nd._px:nd.cx,py=nd._py!=null?nd._py:nd.cy;
    ctx.font='650 10px Menlo,monospace';ctx.fillStyle='#93a0c4';
    ctx.fillText(nd.id,px,py+Rv+14);
    if(nd.score!=null){
      ctx.font='750 10px Menlo,monospace';
      ctx.fillStyle=nd.sel?'#d7f463':'#8fb8ff';
      ctx.fillText(Number(nd.score).toFixed(2),px,py-Rv-7);
    }
    ctx.font='9px Inter,sans-serif';
    ctx.fillStyle=nd.sel?'#d7f463':nd.mutation?(nd.mutation.type==='add'?'#7ee2c3':nd.mutation.type==='merge'?'#c59bff':nd.mutation.type==='delete'?'#ff8a9d':'#8fb8ff'):'#5f6b90';
    ctx.fillText(short((nd.mutation?nd.mutation.type+' · ':'')+(nd.name||nd.context||'(empty)'),34),px,py+Rv+27);
  }
}

/* ═══════════════ DOM panels (re-rendered each poll) ═══════════════ */
function renderHero(s,names,activeName,activeIds,b){
  var r=b&&b.reward!=null?Number(b.reward):null;
  var q=b&&b.qualityScore!=null?Number(b.qualityScore):null;
  var h='<div class="hero-titles"><h1>Textron<br>Live Monitor</h1><div class="hero-sub"><a class="hero-link" href="/trajectory" target="_blank" rel="noopener">trajectory 工程</a></div></div><div class="kpis">';
  h+='<div class="kpi"><div class="k">Active network</div><div class="v">'+esc(short(activeName,20))+'</div></div>';

// ── Harness 轨迹: 思考→回答 链 + 反馈/沉淀(不显示动作/观察) ──
function buildTrajectories(events){
  var trajs=[],cur=null;
  for(var i=0;i<events.length;i++){
    var e=events[i];
    if(e.action==='context_user_message_injected'){
      if(cur)trajs.push(cur);
      cur={ts:e.ts,parts:[e]};
    } else if(cur){cur.parts.push(e);}
  }
  if(cur)trajs.push(cur);
  return trajs.slice(-6).reverse();
}
function escTag(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

  for(var t=0;t<trajs.length;t++){
    var turn=trajs[t];
    var inputE=null, injE=null;
    var chain=[];
    for(var i=0;i<turn.parts.length;i++){
      var e=turn.parts[i], a=e.action;

    var oldData = !chain.some(function(x){return x.k==='✦ 回答'});
    }
    var bwE=null, skipE=null;
    for(var i=0;i<turn.parts.length;i++){

    var stAct=injE?('命中 '+String(injE.activatedCount||'?')+'/'+String(injE.totalNodeCount||'?')+'节点 · '+String(injE.selectedPathCount||'?')+'路径'):'—';
    // 输入: 2026-08-19 问题可以长一点(90→220字符)
    var inputTxt = (inputE && (inputE.promptPreview||'')) || (inputE && (function(){var s=inputE.injectedPromptPreview||'';var m=s.indexOf('## 🧠 Textron');var core=m>0?s.slice(0,m):s;return core.replace(/^[^\u4e00-\u9fa5A-Za-z0-9]*/,'').slice(0,220)})()) || '(旧采集无输入记录)';
    var dot=bwE?'<span class="dot dot-done"></span>已沉淀':(skipE?'<span class="dot dot-other"></span>未学习':'<span class="dot dot-running"></span>进行中');
    // 回合头(仿 f-row 网格: 时间 | 输入+节点 | 状态)
    h+='<div class="f-row" style="grid-template-columns:92px 1fr auto;padding-top:14px">';
    h+='<span class="f-time">'+esc(fmtClock(turn.ts))+'</span>';
    h+='<span class="f-net">'+(t===0?'<span style="color:#fbbf24;font-weight:700">最新 </span>':'')+esc(inputTxt)+((inputTxt.length>200)?'…':'')+' <span style="color:var(--faint);font-family:var(--mono);font-size:11px">'+esc(stAct)+'</span></span>';
    h+='<span class="f-status">'+dot+'</span></div>';
    // 链式步骤
    if(!chain.length){
      h+='<div class="f-row"><span class="f-time"></span><span class="f-net" style="color:var(--faint)">(旧采集回合: 无思考/回答记录——本会话重启后完整)</span><span class="f-status"></span></div>';
    } else if(oldData){
      h+='<div class="f-row"><span class="f-time"></span><span class="f-net" style="color:var(--faint)">(部分旧采集: 无思考记录)</span><span class="f-status"></span></div>';
    }
    for(var ci=0;ci<chain.length;ci++){
      var st=chain[ci];
      h+='<div class="f-row"><span class="f-time"></span><span class="f-net"><span style="color:'+st.c+';font-weight:600;margin-right:6px">'+st.k+'</span><span style="color:var(--txt);font-weight:400">'+escTag(st.text)+'</span></span><span class="f-status"></span></div>';
    }
    // 反馈 + 沉淀
    var rw='<span style="color:var(--faint)">无反馈信号</span>', lr='<span style="color:var(--faint)">未触发 backward</span>';
    if(bwE){
      var rv=bwE.reward!==undefined?Number(bwE.reward).toFixed(2):(bwE.llmReward!==undefined?Number(bwE.llmReward).toFixed(2):null);
      rw=rv!==null?'<span style="color:#fbbf24;font-weight:600">+'+rv+'</span>':'<span style="color:#fbbf24">✓</span>';
      if(bwE.rationale)rw+=' <span style="color:var(--faint)">· '+esc((bwE.rationale||'').slice(0,60))+'</span>';
      var up=Number(bwE.nodesUpdated||0),ad=Number(bwE.nodesAdded||0),rm=Number(bwE.nodesRemoved||0)||Number(bwE.nodesDeleted||0),mg=Number(bwE.nodesMerged||0);
      lr='<span style="color:#22c55e">更新'+up+'</span> '+(ad?'<span style="color:#3b82f6">新增'+ad+'</span> ':'')+(mg?'<span style="color:#a855f7">合并'+mg+'</span> ':'')+(rm?'<span style="color:var(--pink)">删除'+rm+'</span> ':'')+'<span style="color:var(--faint)">· edges '+String(bwE.edgesUpdated||0)+'</span>';
    } else if(skipE){rw='<span style="color:var(--pink)">未学习</span> <span style="color:var(--faint)">· '+esc(String(skipE.action||'').replace('semantic_backward_','').replace('agent_end_',''))+'</span>'+(skipE.reason?'<span style="color:var(--faint)"> · 原因: '+esc(String(skipE.reason))+'</span>':'')+(skipE.hasHighEntropy===false?' <span style="color:var(--faint)">· 无HE</span>':'')+(skipE.hasMatch===false?' <span style="color:var(--faint)">· 无匹配任务</span>':'');}
    else {rw='<span style="color:var(--faint)">等待反馈…</span>';lr='<span style="color:var(--faint)">等待 backward…</span>';}
    h+='<div class="f-row"><span class="f-time"></span><span class="f-net"><span style="color:#fbbf24;font-weight:600;margin-right:6px">📈 反馈</span><span style="color:var(--txt)">'+rw+'</span></span><span class="f-status"></span></div>';
    h+='<div class="f-row" style="padding-bottom:14px"><span class="f-time"></span><span class="f-net"><span style="color:#ec4899;font-weight:600;margin-right:6px">🧠 沉淀</span><span style="color:var(--txt)">'+(lr||'—')+'</span></span><span class="f-status"></span></div>';
  }
  return h+'</div>';
}

function render(s){
  var names=Object.keys(s.networks||{});
  if(!names.length){graphsEl.innerHTML='<div class="panel">No Textron networks.</div>';return}
  var activeName=s.currentTaskFamily&&s.networks[s.currentTaskFamily]?s.currentTaskFamily:names[0];
  // 激活网络排到最前（其余保持原顺序）
  names.sort(function(a,b){
    if(a===activeName)return -1;
    if(b===activeName)return 1;
    return 0;
  });
  var activeIds=(s.currentActivatedIds||[]);
  var b=s.lastBackwardState||null;

  var hn=$('hdr-net');if(hn)hn.textContent=activeName;

  renderHero(s,names,activeName,activeIds,b);

  // graphs: persistent views, update in place
  for(var ni=0;ni<names.length;ni++){
    var name=names[ni],net=s.networks[name];
    updateGraphView(name,net,name===activeName?s:null);
  }
  for(var k in graphViews){
    if(!s.networks[k]){graphViews[k].panel.remove();delete graphViews[k]}
  }
  // 激活网络置顶：用 CSS `order` 排序（不移动 DOM ⇒ 不会重置滚动位置）
  // 注：早期用 appendChild 重排，而 render() 每 1.5s 轮询一次，会把滚动条反复挤回顶部
  for(var no=0;no<names.length;no++){
    var gvo=graphViews[names[no]];
    if(gvo&&gvo.panel)gvo.panel.style.order=no;
  }
  for(var km in graphViews){if(graphViews[km].panel)graphViews[km].panel.id=''}
  if(graphViews[names[0]])graphViews[names[0]].panel.id='sec-graph';

  renderSteps(s,activeIds,b);

  // 轨迹面板 + 模板面板(主列挂载)
  var trajEl=document.getElementById("trajSlot");
  if(trajEl)trajEl.innerHTML=renderTrajectory(s.backwardEvents||[]);

  var dh='<details class="panel diag-details"'+diagAttrs('backward')+'><summary>↩ Semantic Backward 详情</summary><div class="diag-body">'+renderBackwardInner(b)+'</div></details>';
  var rawHtml=renderRawLLMResponse(s.backwardEvents||[]);
  if(rawHtml)dh+='<details class="panel diag-details"'+diagAttrs('raw')+'><summary>🧾 Raw LLM Response 诊断</summary><div class="diag-body">'+rawHtml+'</div></details>';
  setHTML(diagEl,dh);
  bindDiagState();

  setHTML(sideEl,renderFindings(s.backwardEvents||[])+renderMutationChart(s.backwardEvents||[])+renderOverview(s,activeName,s.networks[activeName],b)+renderRewardBars(s.backwardEvents||[]));
  var btn=$('btn-hist');
  if(btn)btn.onclick=function(){histExpanded=!histExpanded;if(lastS)render(lastS)};
}

async function poll(){
  try{
    var r=await fetch('/api/state?t='+Date.now(),{cache:'no-store'});
    var s=await r.json();
    lastS=s;render(s);
  }catch(e){
    if(!lastS)graphsEl.innerHTML='<div class="panel">ERROR: '+esc(e.message)+'</div>';
  }
  var c=$('hdr-clock');if(c)c.textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
}

// rail icon scroll
var ricons=document.querySelectorAll('.ricon');
for(var ri=0;ri<ricons.length;ri++){
  ricons[ri].addEventListener('click',function(){
    // 轨迹图标 → 独立页新窗口打开(不在主页面内嵌)
    if(this.getAttribute('data-target')==='sec-events'){
      window.open('/trajectory','_blank');
      return;
    }
    for(var j=0;j<ricons.length;j++)ricons[j].classList.remove('active');
    this.classList.add('active');
    var t=$(this.getAttribute('data-target'));
    if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
  });
}

// master animation loop: WebGL background + all graph canvases (adaptive 15–30 FPS)

/* ═══════════════ 网络管理面板: 新建 / 切换(pin) / 每层激活数 ═══════════════ */
var nmMsg='';
function nmSay(m,err){nmMsg=m;var el=document.querySelector('.nm-msg');if(el){el.textContent=m;el.className='nm-msg'+(err?' err':'')}}
async function nmPost(url,body){
  try{
    var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    var d=await r.json();
    if(!d.ok){
      var em=d.error||('HTTP '+r.status);
      if(em.indexOf('already exists')>=0)em='该名称已被占用 — 换一个名字（网络不能重名）';
      else if(em.indexOf('need 2-8 layers')>=0)em='层数需 2–8 层、每层 1–64 个节点（例：4,6,8）';
      nmSay('✗ '+esc(em),true);return null;
    }
    return d;
  }catch(e){nmSay('✗ '+esc(e.message),true);return null}
}
function renderNetMgr(d){
  var cfg=d.config||{},nets=d.networks||[];
  var pinned=cfg.pinnedTaskFamily||null;
  var h='<div class="nm-grid">';
  // 左列: 网络列表(点击切换 pin / AUTO 回自动路由)
  h+='<div class="nm-col">';
  h+='<div class="nm-card"><div class="nm-title">① 使用哪个网络</div><div class="nm-sub">点任意一行即切换；对话时只会用到「当前」标出的那张。切换不会删除旧网络。</div>';
  h+='<div class="nm-net'+(pinned?'':' on')+'" data-pin=""><span>'+(pinned?'○':'●')+' 自动路由</span>'+(pinned?'':'<span class="nm-layers">当前</span>')+'</div>';
  for(var i=0;i<nets.length;i++){
    var n=nets[i],uc=(n.nodeCounts||[]).map(function(c){return c.used+'/'+(c.cap!=null?c.cap:c.capacity)}).join(' · ');
    var totalUsed=0;for(var nc=0;nc<(n.nodeCounts||[]).length;nc++)totalUsed+=n.nodeCounts[nc].used;
    h+='<div class="nm-net'+(pinned===n.name?' on':'')+'" data-pin="'+esc(n.name)+'"><span>'+(pinned===n.name?'●':'○')+' <b>'+esc(n.name)+'</b></span><span class="nm-layers">['+(n.layers||[]).join(',')+'] '+uc+(pinned===n.name&&totalUsed===0?'<span class="nm-empty">空网络：还没有节点，随对话训练积累</span>':'')+'</span></div>';
  }
  h+='</div>';
  // 右列: 新建 + 激活数
  h+='<div class="nm-col">';
  h+='<div class="nm-card"><div class="nm-title">② 新建网络</div><div class="nm-sub">建一张全新的空白知识网络（独立于已有网络，不会合并进去）。</div>';
  h+='<div class="nm-row">'
    +'<div class="nm-field"><label>名称 <span class="q" title="新网络的唯一名字，字母/数字/中文/下划线">ⓘ</span></label><input id="nm-name" placeholder="如 music_prod"></div>'
    +'<div class="nm-field"><label>每层节点数 <span class="q" title="逗号分隔，共 2–8 层，每层 1–64 个节点。建议前窄后宽，如 4,6,8">ⓘ</span></label><input id="nm-layers" placeholder="4,6,8" style="width:100px"></div>'
    +'<div class="nm-field"><label>激活阈值 <span class="q" title="0–1，越小越容易激活节点；留空用默认 0.2">ⓘ</span></label><input id="nm-thr" class="nm-k" placeholder="默认"></div>'
    +'<div class="nm-field"><label>学习率 <span class="q" title="0–0.2，训练步长；留空用默认 0.015">ⓘ</span></label><input id="nm-lr" class="nm-k" placeholder="默认"></div>'
    +'<button class="nm-btn primary" id="nm-create">新建</button></div>';
  h+='<div class="nm-hint">层数 2–8 · 每层节点 1–64 · 新网络从零开始，靠每轮对话的 HighEntropy 蒸馏填充节点</div>';
  var pinnedNet=null;
  for(var j=0;j<nets.length;j++)if(nets[j].name===pinned)pinnedNet=nets[j];
  var layerN=pinnedNet&&pinnedNet.layers?pinnedNet.layers.length:3;
  h+='</div>';
  h+='<div class="nm-card"><div class="nm-title">③ 每层激活多少节点（topK）</div><div class="nm-sub">每轮对话从每层挑多少节点参与传播 → 直接决定注入多少上下文。填得少=上下文精简，填得多=更全面但更嘈杂。'+(pinnedNet?'当前网络：<b>'+esc(pinnedNet.name)+'</b>（'+layerN+' 层）':'当前：自动路由（此设置全局生效）')+'</div>';
  h+='<div class="nm-row"><div class="nm-field"><label>全局默认 <span class="q" title="所有层统一用这个值">ⓘ</span></label><input id="nm-topk" class="nm-k" value="'+esc(cfg.topK!=null?cfg.topK:(cfg.topKEffective!=null?cfg.topKEffective:3))+'"></div><button class="nm-btn" id="nm-save-topk">保存全局</button><button class="nm-btn ghost" id="nm-clear-layer" title="删除按层覆盖，回到统一的全局值">恢复全局</button></div>';
  h+='<div class="nm-row" id="nm-perlayer">';
  for(var l=0;l<layerN;l++){
    var v=cfg.topKByLayer&&cfg.topKByLayer[String(l)]!=null?cfg.topKByLayer[String(l)]:'';
    h+='<div class="nm-field"><label>L'+l+'</label><input class="nm-k nm-lk" data-l="'+l+'" placeholder="—" value="'+v+'"></div>';
  }
  h+='<button class="nm-btn" id="nm-save-layer" title="只覆盖填了数字的层，留空的层继续用全局值">按层保存</button></div>';
  h+='</div>';
  // ④ 网络目标（反传时读取，作为离域清洗裁判）
  h+='<div class="nm-card"><div class="nm-title">④ 网络目标 <span class="q" title="告诉这张网络「只该沉淀什么」。反向传播时读取：与目标无关的已有节点（工程/API/配置/审计等异域知识）会被判为离域污染，强制用 node_updates 覆盖重写为目标域知识">ⓘ</span></div>';
  h+='<div class="nm-sub">声明该网络只该沉淀什么经验'+(pinnedNet?('（当前网络：<b>'+esc(pinnedNet.name)+'</b>）'):'（当前：自动路由——先在 ① 选中一张网络才能设定目标）')+'。反传时作为准入裁判：离域节点会被重写清洗，且禁止 merge 进目标域节点（防关键词垃圾抽屉）。</div>';
  h+='<div class="nm-row"><div class="nm-field" style="flex:1"><label>目标 <span class="q" title="例：沉淀交易经验。留空/清除 = 不做目标约束（旧行为）。最长 300 字符">ⓘ</span></label><input id="nm-goal" placeholder="如 沉淀交易经验" value="'+esc(pinnedNet?(pinnedNet.goal||''):'')+'"></div>'
    +'<button class="nm-btn primary" id="nm-save-goal">保存目标</button><button class="nm-btn ghost" id="nm-clear-goal" title="清除后网络回到无目标约束">清除</button></div>';
  h+='<div class="nm-hint">建议写成一句话领域声明（如「沉淀交易经验：买点/仓位/止损的可复用判断」）· 设置后下一次反向传播即生效（无需重启）</div>';
  h+='</div>';
  h+='</div></div>';
  h+='<div class="nm-msg">'+esc(nmMsg)+'</div>';
  var el=$('netmgr');if(!el)return;el.innerHTML=h;
  // bind
  var nets0=el.querySelectorAll('.nm-net');
  for(var k=0;k<nets0.length;k++)nets0[k].onclick=function(){
    nmPost('/api/networks/pin',{taskFamily:this.getAttribute('data-pin')||null}).then(function(r){if(r)nmSay(r.config.pinnedTaskFamily?('✓ 已锁定: '+r.config.pinnedTaskFamily):'✓ 已切换为自动路由')||netmgrRefresh()});
  };
  var bc=$('nm-create');if(bc)bc.onclick=async function(){
    var name=$('nm-name').value.trim(),layers=$('nm-layers').value.trim();
    if(!name){nmSay('✗ 请先填写网络名称（如 music_prod）',true);return}
    var arr=layers?layers.split(',').map(function(s){return parseInt(s.trim(),10)}).filter(function(n){return Number.isFinite(n)&&n>0&&n<=64}):[];
    if(arr.length<2||arr.length>8){nmSay('✗ 每层节点数格式：逗号分隔的数字，共 2–8 层、每层 1–64（例：4,6,8）',true);return}
    var thr=parseFloat($('nm-thr').value),lr=parseFloat($('nm-lr').value);
    var body={taskFamily:name,layers:arr};
    if(Number.isFinite(thr)&&thr>0&&thr<1)body.threshold=thr;
    if(Number.isFinite(lr)&&lr>0&&lr<1)body.learningRate=lr;
    var r=await nmPost('/api/networks/init',body);
    if(r){nmSay('✓ 已创建网络 '+r.taskFamily+' ['+r.layers.join(',')+']，并自动切换为当前网络');
      await nmPost('/api/networks/pin',{taskFamily:r.taskFamily});netmgrRefresh()}
  };
  var st=$('nm-save-topk');if(st)st.onclick=async function(){
    var r=await nmPost('/api/networks/topk',{topK:parseInt($('nm-topk').value,10)});
    if(r){nmSay('✓ 全局激活数 = '+r.config.topK);netmgrRefresh()}
  };
  var cl=$('nm-clear-layer');if(cl)cl.onclick=async function(){
    var r=await nmPost('/api/networks/topk',{topKByLayer:null});
    if(r){nmSay('✓ 已清除按层覆盖, 用全局值');netmgrRefresh()}
  };
  var sl=$('nm-save-layer');if(sl)sl.onclick=async function(){
    var m={},inputs=document.querySelectorAll('.nm-lk'),any=false;
    for(var q=0;q<inputs.length;q++){var v=parseInt(inputs[q].value,10);if(Number.isFinite(v)&&v>=1&&v<=8){m[inputs[q].getAttribute('data-l')]=v;any=true}}
    if(!any){nmSay('按层输入留空或无效 — 填 1-8 后再保存',true);return}
    var r=await nmPost('/api/networks/topk',{topKByLayer:m});
    if(r){nmSay('✓ 按层激活数 = '+JSON.stringify(r.config.topKByLayer));netmgrRefresh()}
  };
  var sg=$('nm-save-goal');if(sg)sg.onclick=async function(){
    if(!pinnedNet){nmSay('✗ 请先在 ① 选中一张网络 — 自动路由下无法确定目标归属',true);return}
    var r=await nmPost('/api/networks/goal',{taskFamily:pinnedNet.name,goal:$('nm-goal').value});
    if(r){nmSay(r.goal?('✓ '+r.taskFamily+' 目标已保存（下次反传生效）：'+r.goal):('✓ '+r.taskFamily+' 已清除目标，回到无约束'));netmgrRefresh()}
  };
  var cg=$('nm-clear-goal');if(cg)cg.onclick=async function(){
    if(!pinnedNet){nmSay('✗ 请先在 ① 选中一张网络',true);return}
    var r=await nmPost('/api/networks/goal',{taskFamily:pinnedNet.name,goal:''});
    if(r){nmSay('✓ 已清除 '+r.taskFamily+' 的目标约束');netmgrRefresh()}
  };
}
async function netmgrRefresh(){
  try{
    var r=await fetch('/api/networks?t='+Date.now(),{cache:'no-store'});
    var d=await r.json();
    if(d.ok)renderNetMgr(d);
  }catch(e){/* monitor 未重启或接口缺失时静默 */}
}
netmgrRefresh();setInterval(function(){if(!document.hidden&&document.activeElement&&document.activeElement.tagName!=='INPUT')netmgrRefresh()},10000);

initBG();
var lastDraw=0,fpsTarget=30,costAcc=0,costN=0,frameNo=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(document.hidden)return;
  if(ts-lastDraw<1000/fpsTarget-2)return;
  var start=performance.now();
  var t=ts/1000;
  if(bgGL&&(frameNo++%2===0))bgGL.draw(t);
  for(var k in graphViews)drawGraph(graphViews[k],t);
  lastDraw=ts;
  costAcc+=performance.now()-start;costN++;
  if(costN>=48){
    var avg=costAcc/costN;costAcc=0;costN=0;
    if(avg>34&&fpsTarget>15)fpsTarget=15;
    else if(avg<16&&fpsTarget<30)fpsTarget=30;
  }
}
requestAnimationFrame(loop);

var evt;
try{evt=new EventSource('/events');evt.addEventListener('propagate_live',function(){if(!document.hidden)poll()});evt.addEventListener('update',function(){if(!document.hidden)poll()})}catch(e){}
poll();setInterval(function(){if(!document.hidden)poll()},1500);
// 2026-08-19: 后台标签页暂停轮询(节省资源, 回前台立即刷新)
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});
})();
